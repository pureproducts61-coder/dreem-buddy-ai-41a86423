name: TIVO Build Factory

# Truthful build targets:
#   web  -> real: produces dist/ (PWA)
#   apk  -> real: Capacitor + Gradle produce an installable debug .apk
#   exe  -> NOT implemented; a web dist is never published as an .exe
on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build target'
        required: true
        default: 'web'
        type: choice
        options:
          - web
          - apk

jobs:
  web:
    if: ${{ github.event.inputs.build_type == 'web' || github.event.inputs.build_type == 'apk' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest
      - run: bun install
      - run: bun run build
      - name: Upload web bundle (dist, not an installer)
        uses: actions/upload-artifact@v4
        with:
          name: tivo-web-dist
          path: dist/

  apk:
    if: ${{ github.event.inputs.build_type == 'apk' }}
    needs: web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - run: bun install
      - run: bun run build
      - name: Create/refresh the Android project
        run: |
          if [ ! -d android ]; then bunx cap add android; fi
          bunx cap sync android
      - name: Assemble debug APK
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: tivo-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
